# publish is "dist" -- do NOT "fix" this to .output/public.
#
# `nuxt generate` does not always write to the same place. Nitro picks its
# preset from the environment: run locally it uses `static` and writes
# .output/public, but Netlify's build sets NETLIFY in the environment, Nuxt
# auto-detects it and switches to the `netlify-static` preset, which writes
# to dist instead. Verified by running Netlify's own build orchestrator
# (`netlify build`), which logs "Nitro preset: netlify-static" and produces
# dist/ while .output/public is never created.
#
# This is exactly how the site broke on 2026-09-12. publish was "dist" and
# correct; commit cd52fc6 changed it to .output/public after checking where a
# LOCAL `nuxt generate` writes, and every Netlify build failed from that
# moment until 2026-09-14 -- 20 in a row, including the production build of
# the merge of PR #6. Nobody noticed because the site kept serving the last
# good deploy, and because the deploys that still looked green were CLI
# uploads from a GitHub Action rather than Netlify builds.
#
# So: a local build writing .output/public proves nothing about this value.
# If you need to check it, run `netlify build` (not `nuxt generate`) and look
# at which directory appears.
#
# The Netlify dashboard's build settings are kept identical to these on
# purpose -- when the two disagree it is not obvious which wins. Change both.
[build]
  command = "pnpm run generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Tells Bing and the other IndexNow engines which pages each production
# deploy added, changed or removed. Local plugin, see plugins/indexnow/index.js;
# it skips deploy previews and branch deploys on its own.
[[plugins]]
  package = "./plugins/indexnow"

# Baseline security headers; until now the only one sent was HSTS.
# - Permissions-Policy turns off device APIs this site never uses. The
#   product video iframe only needs autoplay/encrypted-media/gyroscope, which
#   stay allowed.
# - X-Frame-Options instead of a CSP frame-ancestors: nothing frames this
#   site, and a full CSP has to allowlist Google Fonts and the post-consent
#   Google Ads tag -- worth doing, but in Report-Only first, not blind.
# - HSTS is left as Netlify sends it. includeSubDomains would also bind
#   app.quiroflow.com and anything added under the domain later.
# Headers from [[headers]] here and from dist/_headers (cache rules Nitro
# writes for /_nuxt and the sitemaps) are merged by Netlify, not replaced.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Frame-Options = "SAMEORIGIN"

# No [[redirects]] here on purpose: they never fired. Nitro's netlify-static
# preset writes a `/* /404.html 404` catch-all into dist/_redirects, which
# Netlify reads before this file. Redirects are routeRules in nuxt.config.ts,
# which Nitro writes into _redirects above that catch-all.
