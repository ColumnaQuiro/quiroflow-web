# publish is "dist" -- do NOT "fix" this to .output/public.
#
# `nuxt generate` does not always write to the same place. Nitro picks its
# preset from the environment: run locally it uses `static` and writes
# .output/public, but Netlify's build sets NETLIFY in the environment, Nuxt
# auto-detects it and switches to the `netlify-static` preset, which writes
# to dist instead. Verified by running Netlify's own build orchestrator
# (`netlify build`), which logs "Nitro preset: netlify-static" and produces
# dist/ while .output/public is never created.
#
# This is exactly how the site broke on 2026-09-12. publish was "dist" and
# correct; commit cd52fc6 changed it to .output/public after checking where a
# LOCAL `nuxt generate` writes, and every Netlify build failed from that
# moment until 2026-09-14 -- 20 in a row, including the production build of
# the merge of PR #6. Nobody noticed because the site kept serving the last
# good deploy, and because the deploys that still looked green were CLI
# uploads from a GitHub Action rather than Netlify builds.
#
# So: a local build writing .output/public proves nothing about this value.
# If you need to check it, run `netlify build` (not `nuxt generate`) and look
# at which directory appears.
#
# The Netlify dashboard's build settings are kept identical to these on
# purpose -- when the two disagree it is not obvious which wins. Change both.
[build]
  command = "pnpm run generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# /sitemap.xml is the path everyone assumes exists, and it may already be
# submitted in Search Console -- but the prerendered file sitting there is an
# HTML meta-refresh stub, not XML (see public/robots.txt for why). A real 301
# to the actual index is what a crawler can follow. force = true because
# Netlify serves a matching static file before applying redirects, and that
# stub would otherwise win.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap_index.xml"
  status = 301
  force = true

# The "Quiénes somos" page was removed on 16 Oct 2026: it restated the
# COLUMNAQUIRO S.L. identity block, the Valencia address and the names and
# roles of the people behind the product, which is more than the owners want
# public on a marketing page. The same identity data still exists in
# aviso-legal and politica-de-privacidad because Spanish LSSI-CE art. 10 and
# the GDPR require a reachable controller identity -- those two pages are
# noindexed, which is as far as it can be taken.
#
# 301 rather than letting the paths 404: all three locales were in the
# sitemap and linked from the header and footer of every page, so they are
# indexed and may have external links. Google treats a 301 to the homepage as
# a soft removal and drops them from the index on its own.
[[redirects]]
  from = "/quienes-somos"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/en/about"
  to = "/en"
  status = 301
  force = true

[[redirects]]
  from = "/fr/a-propos"
  to = "/fr"
  status = 301
  force = true
